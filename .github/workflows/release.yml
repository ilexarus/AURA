name: Build and publish AURA

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      AURA_VOICE_PROFILE: quality
      AURA_VOICE_SPEAKER: eugene

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version from tag
        shell: pwsh
        run: python tools/set_version.py "${{ github.ref_name }}"

      - name: Configure update repository
        shell: pwsh
        run: python tools/configure_updates.py --repository "${{ github.repository }}"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt pyinstaller numpy

      - name: Install CPU PyTorch for voice generation
        shell: pwsh
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate local Silero voice pack
        shell: pwsh
        run: python tools/generate_silero_voice.py --profile "$env:AURA_VOICE_PROFILE" --speaker "$env:AURA_VOICE_SPEAKER"

      - name: Run tests
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Build AURA and updater
        shell: cmd
        env:
          AURA_SKIP_VOICE_GENERATION: "1"
        run: BUILD_PORTABLE.cmd

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\AURA.iss"
          python tools/make_checksum.py "dist\installer\AURA-Setup-$version.exe"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION.txt).Trim()
          $installer = "dist\installer\AURA-Setup-$version.exe"
          $checksum = "$installer.sha256"
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$version" $installer $checksum --clobber
          } else {
            gh release create "v$version" $installer $checksum --title "AURA $version" --generate-notes
          }
